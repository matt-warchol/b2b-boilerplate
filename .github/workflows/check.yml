name: Check

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'CHANGELOG.md', 'LICENSE']
  pull_request:
    paths-ignore: ['docs/**', 'CHANGELOG.md', 'LICENSE']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
